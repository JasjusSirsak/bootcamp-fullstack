<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Page</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <nav>
    <a href="/"><i data-lucide="home"></i> Home</a>
    <a href="/user" class="active"><i data-lucide="users"></i> User</a>
    <a href="/about"><i data-lucide="info"></i> About</a>
    <a href="/contact"><i data-lucide="mail"></i> Contact</a>
  </nav>

  <div class="container">
    <div class="header-section">
      <h1>Halaman User</h1>
      <p>Kelola dan tambahkan data user ke dalam sistem.</p>
    </div>

    <!-- Card Form Tambah User -->
    <div class="card form-card">
      <h2><i data-lucide="user-plus"></i> Tambah User Baru</h2>
      <form id="user-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="nama"><i data-lucide="user"></i> Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama..." required>
          </div>

          <div class="form-group">
            <label for="phone"><i data-lucide="phone"></i> No. HP</label>
            <input type="tel" id="phone" placeholder="08xxxxxxxxxx" required>
          </div>

          <div class="form-group">
            <label for="email"><i data-lucide="mail"></i> Alamat Email</label>
            <input type="email" id="email" placeholder="email@contoh.com">
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <i data-lucide="plus-circle"></i> Tambah User
        </button>
      </form>

      <p id="status-msg" class="status-msg"></p>
    </div>

    <!-- Card Tabel Daftar User -->
    <div class="card table-card">
      <div class="table-header">
        <h2><i data-lucide="users"></i> Daftar User</h2>
      </div>

      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Nama</th>
              <th>No. HP</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <!-- Data dimasukkan via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function renderIcons() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Load Daftar User
    function loadUsers() {
      fetch('/users')
        .then(res => res.json())
        .then(result => {
          const tbody = document.getElementById('user-table-body');
          tbody.innerHTML = ''; // reset dulu

          if (!result.data || result.data.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="4" class="empty-state">
                  <i data-lucide="inbox"></i>
                  <p>Belum ada data user tersedia.</p>
                </td>
              </tr>`;
            renderIcons();
            return;
          }

          result.data.forEach((user, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${index + 1}</td>
              <td class="font-medium">${user.name}</td>
              <td>${user.phone}</td>
              <td class="text-muted">${user.email ?? '-'}</td>
            `;
            tbody.appendChild(tr);
          });

          renderIcons();
        })
        .catch(err => {
          console.error('Gagal load user:', err);
        });
    }

    // Submit Form
    document.getElementById('user-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const nama  = document.getElementById('nama').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const statusMsg = document.getElementById('status-msg');

      fetch('/add-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nama, phone, email })
      })
        .then(res => res.json())
        .then(result => {
          statusMsg.className = 'status-msg';
          if (result.status === 'success') {
            statusMsg.classList.add('success');
            statusMsg.innerHTML = '<i data-lucide="check-circle"></i> ' + result.message;
            document.getElementById('user-form').reset();
            loadUsers();
          } else {
            statusMsg.classList.add('error');
            statusMsg.innerHTML = '<i data-lucide="alert-circle"></i> ' + result.message;
          }
          renderIcons();
        })
        .catch(err => {
          statusMsg.className = 'status-msg error';
          statusMsg.innerHTML = '<i data-lucide="alert-circle"></i> Error: ' + err.message;
          renderIcons();
        });
    });

    // Inisialisasi awal
    loadUsers();
  </script>
</body>
</html>
